name: Nine-role bootstrap
on:
  workflow_dispatch:
    inputs:
      execute_paid_reports:
        description: 'Run one paid nine-report cycle after separate scope and cost approval'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: skycar-bot-execution
  cancel-in-progress: false
jobs:
  bootstrap:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'jimmoq-hopsup-Hoqde6/skycar-bot-runner' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      inputs.execute_paid_reports == true
    environment: skycar-agent-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -m pip install -r scripts/autonomy/requirements-pilot.txt
      - name: Verify offline controls before accessing credentials
        run: python3 -m unittest discover -s tests/autonomy -p 'test_*.py' -v
      - name: Run nine report sessions (US$1 session limits, not an all-in cost cap)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/autonomy/team_bootstrap.py --execute --output "$RUNNER_TEMP/skycar-evidence"
      - name: Preserve session IDs and reports, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nine-role-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/skycar-evidence
          retention-days: 14
          if-no-files-found: warn
