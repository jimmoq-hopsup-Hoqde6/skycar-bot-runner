name: 'Recovery guard: supervised pilot'
run-name: 'Recovery guard for producer ${{ inputs.producer_run_id }}'
on:
  workflow_dispatch:
    inputs:
      arm_supervised_recovery:
        description: 'Arm only for one attended pilot after separate cost and scope approval'
        type: boolean
        required: true
        default: false
      producer_run_id:
        description: 'Exact producer run ID; recovery approval appears only after producer readiness'
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: skycar-supervised-recovery
  cancel-in-progress: false
jobs:
  wait-for-producer:
    name: Wait for producer readiness (no API key)
    if: inputs.arm_supervised_recovery == true && github.repository == 'jimmoq-hopsup-Hoqde6/skycar-bot-runner' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    outputs:
      producer_job_id: ${{ steps.ready.outputs.producer_job_id }}
      claim_artifact_id: ${{ steps.ready.outputs.claim_artifact_id }}
      claim_digest: ${{ steps.ready.outputs.claim_digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify live producer and immutable claim without provider access
        id: ready
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ''
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
        run: |
          set -euo pipefail
          python3 scripts/autonomy/supervised_runtime.py wait-producer --producer-id "$PRODUCER_RUN_ID" --output "$RUNNER_TEMP/producer-ready.json"
          python3 - "$RUNNER_TEMP/producer-ready.json" <<'PY'
          import json, os, sys
          proof = json.load(open(sys.argv[1]))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('producer_job_id', 'claim_artifact_id', 'claim_digest'):
                  output.write(key + '=' + str(proof[key]) + '\n')
          PY
  supervised-recovery:
    needs: wait-for-producer
    # Review candidate only; normal protected-environment approval is still mandatory.
    if: needs.wait-for-producer.result == 'success' && inputs.arm_supervised_recovery == true && github.repository == 'jimmoq-hopsup-Hoqde6/skycar-bot-runner' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event_name == 'workflow_dispatch'
    environment: skycar-agent-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned controller SDK without API credentials
        run: python3 -m pip install -r scripts/autonomy/requirements-pilot.txt
      - name: Stage arming candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.SKYCAR_PILOT_OPENAI_API_KEY }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          READY_PRODUCER_JOB_ID: ${{ needs.wait-for-producer.outputs.producer_job_id }}
          READY_CLAIM_ARTIFACT_ID: ${{ needs.wait-for-producer.outputs.claim_artifact_id }}
          READY_CLAIM_DIGEST: ${{ needs.wait-for-producer.outputs.claim_digest }}
        run: python3 scripts/autonomy/supervised_runtime.py stage-recovery --producer-id "$PRODUCER_RUN_ID" --output "$RUNNER_TEMP/arming.json"
      - name: Publish arming receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pilot-recovery-armed-${{ inputs.producer_run_id }}
          path: ${{ runner.temp }}/arming.json
          overwrite: false
          if-no-files-found: error
          retention-days: 14
      - name: Bounded recovery loop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.SKYCAR_PILOT_OPENAI_API_KEY }}
        run: python3 scripts/autonomy/supervised_runtime.py recover --output "$RUNNER_TEMP/arming.json"
      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pilot-recovery-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/arming.json
            ${{ runner.temp }}/cleanup.json
          overwrite: false
          if-no-files-found: warn
          retention-days: 14
