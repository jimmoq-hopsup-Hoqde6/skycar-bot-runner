name: Runner offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python3 -m pip install -r scripts/autonomy/requirements-pilot.txt
      - run: python3 -m unittest discover -s tests/autonomy -p 'test_*.py' -v
