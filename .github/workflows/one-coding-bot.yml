name: 'Producer: one bounded coding bot'
on:
  workflow_dispatch:
    inputs:
      execute_paid_task:
        description: 'Execute only after separate exact-task and all-in cost approval'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: skycar-bot-execution
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'jimmoq-hopsup-Hoqde6/skycar-bot-runner' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      fingerprint: ${{ steps.scope.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: app
          repository: jimmoq-hopsup-Hoqde6/skycar-site
          ref: f10a36fe98961dc1dcfbace37d9323752e1f3ffe
          persist-credentials: false
      - id: scope
        env:
          OPENAI_API_KEY: ''
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = f10a36fe98961dc1dcfbace37d9323752e1f3ffe
          python3 controller/scripts/autonomy/workflow_preflight.py --root app --controller controller > "$RUNNER_TEMP/preflight.json"
          python3 - "$RUNNER_TEMP/preflight.json" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1]))
          assert data['mode'] == 'offline_preflight'
          assert len(data['request_fingerprint']) == 64
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Exact offline pilot scope; protected approval and recovery required\n```json\n' + json.dumps(data, indent=2) + '\n```\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('fingerprint=' + data['request_fingerprint'] + '\n')
          print(json.dumps(data, indent=2))
          PY
          python3 -m unittest discover -s controller/tests/autonomy -p test_bounded_coding_pilot.py -v
          python3 -m unittest discover -s controller/tests/autonomy -p test_review_pilot_artifact.py -v
          python3 -m unittest discover -s controller/tests/autonomy -p test_queue_dry_run.py -v
  coding-task:
    needs: preflight
    # Review candidate only; normal protected-environment approval is still mandatory.
    if: inputs.execute_paid_task == true && needs.preflight.result == 'success' && github.repository == 'jimmoq-hopsup-Hoqde6/skycar-bot-runner' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event_name == 'workflow_dispatch'
    environment: skycar-agent-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: app
          repository: jimmoq-hopsup-Hoqde6/skycar-site
          ref: f10a36fe98961dc1dcfbace37d9323752e1f3ffe
          persist-credentials: false
      - name: Install pinned controller SDK without API credentials
        run: python3 -m pip install -r controller/scripts/autonomy/requirements-pilot.txt
      - name: Stage one-use claim
        env:
          TARGET_RUN: ${{ github.run_id }}
        run: printf '%s\n' "$TARGET_RUN" > "$RUNNER_TEMP/one-use-claim.txt"
      - name: Publish one-use claim
        id: claim
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pilot-one-use-claim
          path: ${{ runner.temp }}/one-use-claim.txt
          overwrite: false
          if-no-files-found: error
          retention-days: 14
      - name: Execute one approved artifact-only task
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAIM_ARTIFACT_ID: ${{ steps.claim.outputs.artifact-id }}
          OPENAI_API_KEY: ${{ secrets.SKYCAR_PILOT_OPENAI_API_KEY }}
          TRUSTED_RUN_ID: ${{ github.run_id }}
          TRUSTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
          REVIEWED_FINGERPRINT: ${{ needs.preflight.outputs.fingerprint }}
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = f10a36fe98961dc1dcfbace37d9323752e1f3ffe
          python3 controller/scripts/autonomy/supervised_runtime.py execute \
            --root app --output "$RUNNER_TEMP/coding-pilot"
      - name: Prepare review patch without executing generated code
        run: |
          python3 controller/scripts/autonomy/review_pilot_artifact.py \
            --root app --sha f10a36fe98961dc1dcfbace37d9323752e1f3ffe \
            --artifact "$RUNNER_TEMP/coding-pilot/changes.json" \
            --state "$RUNNER_TEMP/coding-pilot/state.json" \
            --output "$RUNNER_TEMP/candidate-review"
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: one-coding-bot-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/coding-pilot
            ${{ runner.temp }}/candidate-review
          retention-days: 14
          if-no-files-found: warn
